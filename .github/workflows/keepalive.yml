name: Keepalive

# A free-tier Supabase project pauses after about a week of inactivity and a
# paused project cannot run its own pg_cron, so the ping has to come from
# outside. It calls public.keepalive() (see supabase/migrations/*_keepalive.sql)
# through the Data API with the publishable key.

on:
  schedule:
    # 03:17 UTC on every 3rd day of the month (1, 4, 7, ...). Month ends give a
    # gap of 1-3 days, never more than 3.
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping hosted Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call public.keepalive()
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "${SUPABASE_PROJECT_REF:-}" ] || missing+=(SUPABASE_PROJECT_REF)
          [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ] || missing+=(SUPABASE_PUBLISHABLE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "## :x: Keepalive not sent"
              echo
              echo "Missing repository secret(s): \`${missing[*]}\`."
              echo "Add them under Settings > Secrets and variables > Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing repository secret(s): ${missing[*]}"
            exit 1
          fi

          # The URL embeds the project ref; keep it out of the logs too.
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/rpc/keepalive"
          echo "::add-mask::${url}"

          # The key goes in via a header file so it never appears on a
          # command line (visible in `ps`) or in curl's output.
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          printf 'apikey: %s\n' "$SUPABASE_PUBLISHABLE_KEY" > "$headers"

          status="$(
            curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 30 --retry 3 --retry-delay 10 \
              --request POST \
              --header @"$headers" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "$url"
          )" || status="${status:-000}"

          when="$(date -u '+%Y-%m-%d %H:%M UTC')"
          if [[ "$status" == 2* ]]; then
            {
              echo "## :white_check_mark: Keepalive sent"
              echo
              echo "\`public.keepalive()\` answered HTTP $status at $when."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## :x: Keepalive failed"
              echo
              if [ "$status" = 000 ]; then
                echo "\`public.keepalive()\` did not respond at $when (network error or timeout)."
              else
                echo "\`public.keepalive()\` answered HTTP $status at $when."
              fi
              echo
              echo "If the project is already paused, restore it from the Supabase dashboard."
              echo "401/403: check \`SUPABASE_PUBLISHABLE_KEY\`. 404: check \`SUPABASE_PROJECT_REF\` and that the keepalive migration is pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Keepalive request failed with HTTP $status"
            exit 1
          fi
