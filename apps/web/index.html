<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fraunces (headings) and Cabin (body), see docs/adr/0002-visual-direction.md.
         display=swap keeps text visible with the system fallback while they load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
    />
    <!-- Apply a stored Light/Dark choice before anything renders, so the wrong
         theme never flashes. Mirrors src/theme/theme.ts (see theme.test.ts). -->
    <script>
      try {
        var theme = localStorage.getItem("what-to-eat.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <title>今天吃什麼</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
